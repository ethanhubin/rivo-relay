    # Public-side timings; no URL, query, Authorization, Cookie or payload logging.
    acl rivo_update path_beg /v1/app-updates/apks/ /v1/releases/files/
    http-request set-log-level silent unless rivo_update
    http-request set-var(txn.download_range) bool(true) if { req.hdr(Range) -m found }
    http-response set-var(txn.download_id) res.hdr(X-Rivo-Download-Id) if { res.hdr(X-Rivo-Download-Id) -m reg ^[a-f0-9]{32}$ }
    log-format "rivo_public_download peer=%ci:%cp local=%fi:%fp status=%ST bytes=%B request_ms=%TR queue_ms=%Tw connect_ms=%Tc headers_ms=%Tr active_ms=%Ta termination=%ts trace=%[var(txn.download_id)] range=%[var(txn.download_range)] rtt_us=%[fc_rtt(us)] rttvar_us=%[fc_rttvar(us)] retrans_inflight=%[fc_retrans] lost_inflight=%[fc_lost] unacked=%[fc_unacked]"
