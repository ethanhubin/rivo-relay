<style>
#attachment-design .stage{min-height:640px;padding:20px 8px;box-sizing:border-box;display:flex;justify-content:center}
#attachment-design .phone{color:light-dark(#292332,#ede7f5);background:light-dark(#f8f7fc,#19171e);width:360px;max-width:100%;padding:18px 12px;box-sizing:border-box;border-radius:24px;font:15px/1.6 system-ui;align-self:flex-start}
#attachment-design header{font-weight:600;padding:4px 0 16px;border-bottom:1px solid light-dark(#ddd7ed,#393142)}
#attachment-design header span,#attachment-design footer span{float:right}
#attachment-design .meta{font-size:12px;color:light-dark(#746b80,#b4aabd);margin:15px 0 22px}
#attachment-design article{margin:0 0 20px 28px;background:light-dark(#e9e0ff,#382c50);border-radius:20px;padding:12px 14px;width:fit-content;max-width:calc(100% - 28px);box-sizing:border-box;margin-left:auto}
#attachment-design p{margin:0 0 12px}#attachment-design .pictures{display:flex;gap:6px}
#attachment-design button{font:inherit;color:inherit;cursor:pointer}
#attachment-design .thumb{display:block;padding:0;border:1px solid light-dark(#d8cfea,#554765);border-radius:10px;overflow:hidden;background:light-dark(#f7f5fc,#211b2a);position:relative;width:76px;height:88px;flex-shrink:1}
#attachment-design .thumb.single{width:74px;height:160px}
#attachment-design img{display:block;width:100%;height:100%;object-fit:contain}
#attachment-design b{position:absolute;inset:0;display:grid;place-items:center;background:#0008;color:white;font-weight:500;font-size:20px}
#attachment-design .reply{margin:0 0 24px;font-size:14px}
#attachment-design footer{margin-top:24px;padding:15px;border:1px solid light-dark(#ded9e6,#453d50);border-radius:22px;color:light-dark(#82798a,#b1a7bb);font-size:13px}
#attachment-design .file{display:flex;align-items:center;gap:12px;text-align:left;padding:8px;border:0;border-radius:12px;width:100%;background:light-dark(#f5f0ff,#292235)}
#attachment-design .file img{width:44px;height:64px;border-radius:5px}#attachment-design small{display:block;font-size:12px;color:light-dark(#7a7186,#b7acc5)}
#attachment-design .file i{margin-left:auto}
#attachment-design .expanded{height:auto!important;width:100%!important;max-height:600px}
</style>
